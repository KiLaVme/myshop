[project]
name = "hop-and-barley-shop"
version = "0.1.0"
description = "Інтернет-магазин на Django/DRF (навчальний проєкт, HTML-дизайн Hop & Barley)."
requires-python = ">=3.12"
dependencies = [
    # --- Крок 1: базова інфраструктура ---
    "django==5.0.7",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.1",
    "gunicorn==22.0.0",
    "whitenoise==6.7.0",
    # --- Крок 2: модель Product.image (ImageField) ---
    "pillow==10.4.0",
    # --- Крок 3: каталог (фільтри за категорією/ціною) ---
    "django-filter==24.2",
    # --- Крок 9: REST API, JWT, Swagger ---
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "drf-spectacular==0.27.2",
    "django-cors-headers==4.4.0",
    # --- Крок 11: GraphQL (бонус) ---
    "graphene-django==3.2.2",
]

[project.optional-dependencies]
dev = [
    # --- Крок 10: тести, лінтери, типізація ---
    "flake8==7.1.0",
    "mypy==1.11.0",
    "django-stubs==5.0.4",
    "djangorestframework-stubs==3.15.0",
    "pytest==8.3.2",
    "pytest-django==4.8.0",
    "pytest-cov==5.0.0",
]

[tool.uv]
# Проєкт з самого початку веде залежності через uv (сучасний, швидкий
# менеджер пакетів), а не pip/requirements.txt - щоб при зростанні
# проєкту не доводилось переходити на інший інструмент.
# Локально: `uv sync` створить .venv і встановить залежності,
# `uv lock` перегенерує uv.lock після зміни pyproject.toml.
