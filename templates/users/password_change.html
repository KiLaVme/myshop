{% extends "base.html" %}

{% block title %}Зміна пароля | Hop & Barley{% endblock %}

{% block content %}
<div class="container auth-page">
    <h1>Зміна пароля</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="field-error">{{ field.errors|join:", " }}</p>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="button button--primary">Змінити пароль</button>
    </form>
</div>
{% endblock %}
